<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>知识图谱关系标注工作台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div class="brand">
          <div>
            <h1>关系标注</h1>
            <p>基于 CSV 的知识图谱增强</p>
          </div>
          <button id="refreshButton" class="icon-button" title="刷新数据">↻</button>
        </div>

        <label class="search-box">
          <span>搜索知识点</span>
          <input id="nodeSearch" type="search" placeholder="输入名称、ID、课程名" />
        </label>

        <div class="stats" id="stats"></div>
        <div class="candidate-state" id="candidateState"></div>
        <div class="node-list" id="nodeList"></div>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <h2 id="selectedTitle">选择一个知识点</h2>
            <p id="selectedMeta">查看原始层级关系，审核或新增数学语义关系。</p>
          </div>
          <div class="actions">
            <button id="addNodeButton">新建节点</button>
            <button id="editNodeButton">编辑节点</button>
            <button id="deleteNodeButton">删除自定义节点</button>
            <button id="undoButton">撤销</button>
            <button id="redoButton">反撤销</button>
            <button id="saveButton">保存进度</button>
            <button id="importCandidatesButton">导入候选</button>
            <button id="exportGoldButton">导出 Gold Set</button>
            <button id="exportButton" class="primary">导出 CSV</button>
          </div>
        </header>

        <section class="panel-grid">
          <section class="panel">
            <div class="panel-title">
              <h3>节点上下文</h3>
              <button id="candidateButton">生成候选</button>
            </div>
            <div id="contextPanel" class="context-grid"></div>
          </section>

          <section class="panel">
            <div class="panel-title">
              <h3>新增关系</h3>
              <button id="addRelationTypeButton">关系类型</button>
            </div>
            <form id="annotationForm" class="form">
              <label>
                源节点
                <select id="startNode"></select>
              </label>
              <label>
                关系类型
                <select id="relationType"></select>
              </label>
              <label>
                目标节点
                <select id="endNode"></select>
              </label>
              <label>
                审核状态
                <select id="status">
                  <option value="accepted">accepted</option>
                  <option value="pending">pending</option>
                  <option value="rejected">rejected</option>
                </select>
              </label>
              <label>
                置信度
                <input id="confidence" type="number" min="0" max="1" step="0.01" placeholder="0.80" />
              </label>
              <label>
                标注人
                <input id="annotator" type="text" placeholder="姓名或小组成员代号" />
              </label>
              <label>
                人工标签
                <select id="humanLabel"></select>
              </label>
              <label>
                错误类型
                <select id="errorType"></select>
              </label>
              <label class="wide">
                备注 / 数学理由
                <textarea id="note" rows="4" placeholder="说明为什么建立这条关系，或记录疑问"></textarea>
              </label>
              <label class="wide">
                人工审核说明
                <textarea id="humanNote" rows="3" placeholder="数学同学写：为什么接受/拒绝/修改这条关系"></textarea>
              </label>
              <button class="primary wide" type="submit">保存关系</button>
            </form>
          </section>
        </section>

        <section class="panel table-panel">
          <div class="panel-title">
            <h3>候选与人工标注</h3>
            <div class="table-filters">
              <button data-filter="all" class="filter active">全部</button>
              <button data-filter="pending" class="filter">待审</button>
              <button data-filter="accepted" class="filter">已接受</button>
              <button data-filter="rejected" class="filter">已拒绝</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>源节点</th>
                  <th>关系</th>
                  <th>目标节点</th>
                  <th>状态</th>
                  <th>置信度</th>
                  <th>来源</th>
                  <th>人工标签</th>
                  <th>错误类型</th>
                  <th>备注</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="annotationTable"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <dialog id="nodeDialog">
      <form method="dialog" id="nodeForm" class="dialog-form">
        <h3>新建 / 编辑节点</h3>
        <input id="nodeId" type="hidden" />
        <label>
          名称
          <input id="nodeName" required />
        </label>
        <label>
          层级
          <input id="nodeLevel" type="number" min="1" placeholder="3" />
        </label>
        <label>
          父节点
          <select id="nodeParent"></select>
        </label>
        <label>
          课程名
          <input id="nodeCourse" />
        </label>
        <menu>
          <button value="cancel">取消</button>
          <button id="saveNodeButton" value="default" class="primary">保存节点</button>
        </menu>
      </form>
    </dialog>

    <dialog id="relationTypeDialog">
      <form method="dialog" id="relationTypeForm" class="dialog-form">
        <h3>新增关系类型</h3>
        <label>
          类型名
          <input id="customRelationType" placeholder="例如 PROVES 或 EQUIVALENT_TO" />
        </label>
        <menu>
          <button value="cancel">取消</button>
          <button id="saveRelationTypeButton" value="default" class="primary">保存类型</button>
        </menu>
      </form>
    </dialog>

    <div id="toast" class="toast"></div>
    <script src="./app.js"></script>
  </body>
</html>
