<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>数学分析知识图谱浏览器</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./vendor/cytoscape.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>数学分析 · KG 浏览器</h1>
        <span class="subtitle" id="kgMeta">加载中…</span>
      </div>
      <div class="topbar-tools">
        <button class="topbar-tool" id="openQueryPanelBtn" type="button">图谱查询</button>
        <button class="topbar-tool" id="openProblemAnalyzerBtn" type="button">错题分析</button>
      </div>
      <div class="topbar-actions">
        <input
          id="searchInput"
          type="search"
          placeholder="搜索知识点（名称模糊匹配，回车定位）"
          autocomplete="off"
        />
        <div class="legend-block">
          <span class="legend-title">关系</span>
          <div class="legend" id="relationLegend"></div>
        </div>
        <div class="legend-block">
          <span class="legend-title">领域</span>
          <div class="legend" id="domainLegend"></div>
        </div>
        <label class="hop-control">
          邻域跳数
          <select id="hopSelect">
            <option value="1">1 跳</option>
            <option value="2" selected>2 跳（到章）</option>
            <option value="3">3 跳（到节）</option>
            <option value="4">4 跳（到知识点）</option>
          </select>
        </label>
        <label class="hop-control">
          <input id="includeContainsToggle" type="checkbox" checked />
          显示层级（章 → 节 → 知识点）
        </label>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar" id="treePanel">
        <div class="search-result-list" id="searchResults" hidden></div>
        <ul class="tree" id="tree"></ul>
      </aside>

      <section class="graph-area">
        <div id="cy"></div>
        <section class="problem-analyzer" id="problemAnalyzer">
          <div class="problem-head">
            <div>
              <h2>错题分析</h2>
              <span>Ollama + 知识图谱约束</span>
            </div>
            <div class="problem-window-actions">
              <button id="clearAnalysisBtn" type="button" title="清除高亮">清除</button>
              <button id="closeProblemAnalyzerBtn" type="button" title="隐藏到后台">关闭</button>
            </div>
          </div>
          <textarea
            id="problemInput"
            rows="4"
            placeholder="粘贴一道期末原题，例如：求函数 f(x)=x^2 sin(1/x) 在 x=0 处的导数"
          ></textarea>
          <div class="problem-controls">
            <select id="problemModelInput" aria-label="Ollama 模型">
              <option value="qwen2.5:7b">qwen2.5:7b</option>
            </select>
            <button id="refreshModelsBtn" type="button" title="刷新本地 Ollama 模型列表">刷新</button>
            <button id="analyzeProblemBtn" type="button">分析考点</button>
          </div>
          <div class="analysis-status" id="analysisStatus">启动 AI 服务后即可分析。</div>
          <div class="analysis-result" id="analysisResult"></div>
        </section>
        <section class="query-panel" id="queryPanel" hidden>
          <div class="query-head">
            <div>
              <h2>图谱查询</h2>
              <span>节点 / 关系 / 多跳路径</span>
            </div>
            <div class="query-window-actions">
              <button id="clearQueryBtn" type="button">清除</button>
              <button id="closeQueryPanelBtn" type="button">关闭</button>
            </div>
          </div>
          <div class="query-tabs" role="tablist" aria-label="图谱查询类型">
            <button class="active" type="button" data-query-tab="node">节点</button>
            <button type="button" data-query-tab="edge">关系</button>
            <button type="button" data-query-tab="path">路径</button>
          </div>

          <div class="query-section active" data-query-section="node">
            <label class="query-field">
              关键词
              <input id="nodeQueryInput" type="text" placeholder="例如：泰勒、极限、Stokes" />
            </label>
            <button id="runNodeQueryBtn" type="button">搜索节点</button>
          </div>

          <div class="query-section" data-query-section="edge">
            <label class="query-field">
              头节点（选填）
              <input id="edgeSourceInput" type="text" placeholder="例如：极限" />
            </label>
            <label class="query-field">
              关系类型
              <select id="edgeTypeSelect"></select>
            </label>
            <label class="query-field">
              尾节点（选填）
              <input id="edgeTargetInput" type="text" placeholder="例如：导数" />
            </label>
            <button id="runEdgeQueryBtn" type="button">搜索关系</button>
          </div>

          <div class="query-section" data-query-section="path">
            <label class="query-field">
              起点
              <input id="pathStartInput" type="text" placeholder="例如：极限" />
            </label>
            <label class="query-field">
              终点
              <input id="pathEndInput" type="text" placeholder="例如：泰勒公式" />
            </label>
            <label class="query-field">
              最大跳数
              <select id="pathMaxHopSelect">
                <option value="1">1 跳</option>
                <option value="2">2 跳</option>
                <option value="3">3 跳</option>
                <option value="4" selected>4 跳</option>
                <option value="5">5 跳</option>
                <option value="6">6 跳</option>
              </select>
            </label>
            <button id="runPathQueryBtn" type="button">搜索路径</button>
          </div>

          <div class="query-status" id="queryStatus">输入条件后开始查询。</div>
          <div class="query-results" id="queryResults"></div>
        </section>
        <div class="empty-hint" id="emptyHint">
          在左侧树中点击知识点，或在搜索框中输入关键词。<br />
          推荐试试「泰勒公式」「Stokes」「条件收敛」「可微的定义」，右侧会同步生成学习路径建议。
        </div>
      </section>

      <aside class="detail" id="detail">
        <div class="placeholder">点击节点查看详情和学习路径建议。</div>
      </aside>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
